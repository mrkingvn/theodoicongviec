<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBND xã Tân Chi · Theo dõi &amp; đôn đốc công việc</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#E9EDF2;
  --bg-2:#DEE4EC;
  --surface:#FFFFFF;
  --surface-2:#F4F6F9;
  --ink:#141B2C;
  --ink-soft:#57647A;
  --ink-faint:#8B96A8;
  --line:#D9DFE7;
  --line-strong:#C2CBD8;
  --red:#9C2B3B;
  --red-dark:#7A1F2E;
  --red-soft:#F4E3E5;
  --gold:#A9822F;
  --gold-soft:#F4ECD8;
  --green:#2C7A5B;
  --green-soft:#DEEEE7;
  --amber:#B97B1F;
  --amber-soft:#F6E9D3;
  --blue:#2E5C8A;
  --blue-soft:#E1EAF3;
  --danger:#B3352B;
  --danger-soft:#F7DFDB;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,27,44,.06), 0 8px 24px -12px rgba(20,27,44,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 500px at 100% -10%, #F1F0E8 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Be Vietnam Pro', -apple-system, "Segoe UI", sans-serif;
  font-size:14px;
  line-height:1.5;
  min-height:100vh;
}
.mono{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;}
h1,h2,h3{font-family:'Source Serif 4', Georgia, serif; margin:0; letter-spacing:.1px;}

/* ---------- layout shell ---------- */
#app{max-width:1360px; margin:0 auto; padding:20px 20px 60px;}

.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  background:linear-gradient(120deg,#1B2740 0%,#141B2C 55%,#3A1E28 100%);
  color:#fff; border-radius:14px; padding:18px 22px; box-shadow:var(--shadow);
  flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:14px;}
.seal{
  width:46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #C1495B, var(--red) 55%, var(--red-dark) 100%);
  border:2px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-family:'Source Serif 4',serif; font-weight:700; font-size:11px;
  transform:rotate(-8deg);
  box-shadow:0 3px 8px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08);
  flex:none;
}
.brand .eyebrow{font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:#C9CFDD; font-weight:600;}
.brand h1{font-size:20px; color:#fff; font-weight:600; margin-top:2px;}
.topbar-controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.topbar-controls select, .topbar-controls button{
  font-family:inherit; font-size:13px; border-radius:8px; border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08); color:#fff; padding:8px 12px; cursor:pointer;
  transition:transform .12s ease, background .12s ease, box-shadow .12s ease;
}
.topbar-controls button:hover{background:rgba(255,255,255,.18); transform:translateY(-1px);}
.topbar-controls button:active{transform:translateY(0);}
.topbar-controls select{ background:rgba(255,255,255,.1); }
.topbar-controls select option{color:#141B2C;}
.btn-primary{
  background:var(--red) !important; border-color:var(--red) !important; font-weight:600;
}
.btn-primary:hover{background:var(--red-dark) !important; box-shadow:0 4px 14px rgba(156,43,59,.45);}
.identity-badge{
  display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:#fff;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:7px 11px;
  flex-wrap:wrap; max-width:100%;
}
.identity-role{
  font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--gold);
  background:rgba(255,255,255,.12); padding:2px 7px; border-radius:99px;
}
.staff-role-pill{display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:99px; margin-left:6px;}
.staff-role-pill.leader{background:var(--red-soft); color:var(--red-dark);}
.staff-role-pill.staffmember{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line-strong);}
.coop-list{display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; max-height:220px; overflow-y:auto; border:1px solid var(--line-strong); border-radius:8px; padding:10px; background:var(--surface-2);}
@media(max-width:560px){.coop-list{grid-template-columns:1fr;}}
.coop-item{display:flex; align-items:center; gap:7px; font-size:12.5px; padding:3px 0; overflow-wrap:break-word; min-width:0;}
.coop-item input{accent-color:var(--red); width:15px; height:15px;}
.readonly-note{font-size:11.5px; color:var(--ink-faint); font-style:italic; padding:8px 0;}
.minhchung-chip{
  display:flex; align-items:center; gap:7px; padding:6px 9px; margin-bottom:5px;
  background:var(--surface-2); border:1px solid var(--line-strong); border-radius:7px; font-size:12.5px;
}
.minhchung-chip a{color:var(--blue); text-decoration:none; font-weight:600; word-break:break-all;}
.minhchung-chip a:hover{text-decoration:underline;}
.mc-icon{flex:none;}
.mc-size{flex:none; color:var(--ink-faint); font-size:11px;}
.mc-remove{flex:none; margin-left:auto; background:none; border:none; color:var(--danger); cursor:pointer; font-size:13px; padding:2px 5px; border-radius:4px;}
.mc-remove:hover{background:var(--danger-soft);}
.task-mc-link{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--blue); text-decoration:none; margin-right:8px;}
.task-mc-link:hover{text-decoration:underline;}
.col-ketqua{width:200px;}
.kq-file-row{display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px dashed var(--line);}
.kq-file-row:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
.kq-file-name{font-size:11.5px; font-weight:600; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-basis:100%;}
.kq-btn{padding:3px 7px !important; font-size:11px !important;}
.login-list{display:flex; flex-direction:column; gap:6px; max-height:360px; overflow-y:auto;}
.login-item{
  display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px; cursor:pointer; flex-wrap:wrap;
}
.login-item:hover{border-color:var(--red); background:var(--red-soft);}
.login-item .name{font-weight:600; font-size:13.5px; overflow-wrap:break-word;}
.login-item .meta{font-size:11.5px; color:var(--ink-soft); overflow-wrap:break-word;}

/* tabs */
.tabs{
  display:flex; gap:4px; margin:18px 0 18px; flex-wrap:wrap;
  background:var(--surface-2); padding:5px; border-radius:12px; border:1px solid var(--line);
}
.tab-btn{
  font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-soft);
  background:transparent; border:none; padding:9px 14px; border-radius:8px; cursor:pointer;
  white-space:nowrap; transition:all .15s ease;
}
.tab-btn.active{background:var(--surface); color:var(--red-dark); box-shadow:var(--shadow); transform:translateY(-1px);}
.tab-btn:hover:not(.active){color:var(--ink); background:rgba(255,255,255,.6);}

/* cards */
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr);}}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow); transition:box-shadow .15s ease;
}
.kpi{transition:transform .15s ease, box-shadow .15s ease;}
.kpi:hover{transform:translateY(-2px); box-shadow:0 4px 16px -4px rgba(20,27,44,.2);}
.kpi .label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-faint); font-weight:700;}
.kpi .value{font-family:'Source Serif 4',serif; font-size:32px; font-weight:600; margin-top:4px;}
.kpi .sub{font-size:12px; color:var(--ink-soft); margin-top:4px;}
.kpi.red .value{color:var(--red-dark);}
.kpi.green .value{color:var(--green);}
.kpi.amber .value{color:var(--amber);}

.section-title{display:flex; align-items:baseline; justify-content:space-between; margin:26px 0 12px;}
.section-title h2{font-size:17px; font-weight:600; padding-left:11px; border-left:4px solid var(--gold); border-radius:2px;}
.section-title .hint{font-size:12px; color:var(--ink-faint);}

/* dept progress bars */
.dept-bar-row{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px dashed var(--line);}
.dept-bar-row:last-child{border-bottom:none;}
.dept-bar-name{width:190px; flex:none; font-weight:600; font-size:13px;}
.dept-bar-track{flex:1; height:10px; background:var(--surface-2); border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.dept-bar-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--red));}
.dept-bar-pct{width:110px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); flex:none;}

/* toolbar */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
.toolbar input[type=text], .toolbar select{
  font-family:inherit; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink);
}
.toolbar input[type=text]{min-width:220px;}
.btn{
  font-family:inherit; font-size:13px; font-weight:600; padding:8px 14px; border-radius:8px;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
}
.btn:hover{border-color:var(--ink-faint); transform:translateY(-1px); box-shadow:0 3px 8px rgba(20,27,44,.10);}
.btn:active{transform:translateY(0); box-shadow:none;}
.btn.small{padding:5px 9px; font-size:12px;}
.btn.danger-outline{color:var(--danger); border-color:var(--danger-soft);}
.btn.danger-outline:hover{background:var(--danger-soft); border-color:var(--danger);}
.btn.gold{background:var(--red); color:#fff; border-color:var(--red);}
.btn.gold:hover{background:var(--red-dark); box-shadow:0 4px 12px rgba(122,31,46,.35);}
.spacer{flex:1;}

/* table */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow);}
table{border-collapse:collapse; width:100%; min-width:1100px;}
thead th{
  background:var(--surface-2); text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--ink-soft); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
  position:sticky; top:0;
}
tbody td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; font-size:13px;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.overdue{background:var(--danger-soft);}
tbody tr.overdue:hover{background:#f4cfc9;}
.col-tt{width:36px; text-align:center; color:var(--ink-faint); font-family:'JetBrains Mono',monospace;}
.col-linhvuc{width:150px; font-weight:600; color:var(--red-dark);}
.col-deadline{width:150px; font-family:'JetBrains Mono',monospace; font-size:12px; white-space:normal;}
.col-people{width:120px; font-size:12.5px;}
.col-actions{width:78px; white-space:nowrap;}
.task-name{font-weight:600; margin-bottom:2px;}
.task-req{color:var(--ink-soft); font-size:12.5px;}
.note{font-size:12px; color:var(--gold); margin-top:4px;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:99px; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
.badge-dot{width:6px;height:6px;border-radius:50%;}
.badge.st-done{background:var(--green-soft); color:var(--green);}
.badge.st-done .badge-dot{background:var(--green);}
.badge.st-doing{background:var(--blue-soft); color:var(--blue);}
.badge.st-doing .badge-dot{background:var(--blue);}
.badge.st-todo{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line-strong);}
.badge.st-todo .badge-dot{background:var(--ink-faint);}
.badge.st-pause{background:var(--amber-soft); color:var(--amber);}
.badge.st-pause .badge-dot{background:var(--amber);}
.badge.overdue-flag{background:var(--danger); color:#fff; margin-left:6px;}

select.status-select{
  border:none; background:transparent; font-family:inherit; font-size:12px; font-weight:700; cursor:pointer;
}

.empty-state{padding:48px 20px; text-align:center; color:var(--ink-faint);}
.empty-state .big{font-size:15px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}

/* modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,27,44,.55); display:flex; align-items:flex-start; justify-content:center;
  padding:40px 16px; overflow-y:auto; z-index:50;
}
.modal{
  background:var(--surface); border-radius:14px; width:100%; max-width:660px; box-shadow:0 20px 60px rgba(0,0,0,.35);
  animation:pop .15s ease-out;
}
@keyframes pop{from{transform:translateY(6px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{font-size:17px;}
.modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-faint); line-height:1;}
.modal-body{padding:20px 22px; display:grid; gap:14px;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.field{display:grid; gap:5px;}
.field label{font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px;}
.field input, .field select, .field textarea{
  font-family:inherit; font-size:13.5px; padding:9px 11px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface-2);
}
.field select[multiple]{ padding:6px; }
.field select[multiple] option{ padding:6px 8px; border-radius:5px; }
.field select[multiple] option:checked{ background:var(--red-soft); color:var(--red-dark); font-weight:600; }
.field textarea{resize:vertical; min-height:56px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:560px){.field-row{grid-template-columns:1fr;}}

/* staff */
.staff-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:820px){.staff-grid{grid-template-columns:1fr;}}
.staff-list{display:flex; flex-direction:column; gap:8px; max-height:520px; overflow-y:auto;}
.staff-unit-group{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.staff-unit-group:last-child{margin-bottom:0;}
.staff-unit-heading{padding-bottom:2px; border-bottom:1px dashed var(--line);}
.staff-item{display:flex; align-items:center; gap:10px; padding:9px 12px; background:var(--surface-2); border-radius:8px; border:1px solid var(--line); flex-wrap:wrap;}
.staff-avatar{
  width:32px;height:32px;border-radius:50%; background:var(--red-soft); color:var(--red-dark); font-weight:700;
  display:flex; align-items:center; justify-content:center; font-size:13px; flex:none;
}
.staff-info{flex:1; min-width:0; overflow-wrap:break-word;}
.staff-name{font-weight:600; font-size:13px;}
.staff-meta{font-size:11.5px; color:var(--ink-soft);}

.pill-dept{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--gold-soft); color:var(--gold);}

/* urging list */
.urge-item{display:flex; gap:12px; padding:12px 14px; border-bottom:1px solid var(--line); align-items:flex-start; flex-wrap:wrap;}
.urge-item:last-child{border-bottom:none;}
.urge-dept{flex:none; width:118px; max-width:100%;}
.urge-body{flex:1; min-width:160px;}
.urge-title{font-weight:600; font-size:13.5px; overflow-wrap:break-word;}
.urge-sub{font-size:12px; color:var(--ink-soft); margin-top:2px; overflow-wrap:break-word;}
.urge-deadline{flex:none; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--danger); font-weight:700;}
@media(max-width:520px){
  .urge-item{flex-direction:column; gap:4px;}
  .urge-dept, .urge-deadline{width:auto; text-align:left;}
}

.foot-note{margin-top:28px; padding-top:16px; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-faint); text-align:center;}
.quicklinks-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;}
.quicklink-item{
  display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:10px; text-decoration:none; color:var(--ink);
  font-size:12.5px; font-weight:600; line-height:1.3; transition:all .15s ease;
}
.quicklink-item:hover{border-color:var(--red); background:var(--red-soft); color:var(--red-dark); transform:translateY(-1px); box-shadow:var(--shadow);}
.ql-icon{font-size:18px; flex:none;}
.ql-label{flex:1;}
.ql-arrow{flex:none; opacity:.45; font-size:13px;}
.quicklink-item:hover .ql-arrow{opacity:1;}

@media print{
  .topbar, .tabs, .toolbar, .col-actions, .no-print{display:none !important;}
  body{background:#fff;}
  .card, .table-wrap{box-shadow:none; border:1px solid #999;}
}
</style>
</head>

<!-- ============================================================

<script>
/* ============================================================
   DỮ LIỆU GỐC (seed) — trích từ 5 văn bản chỉ đạo công việc
   tháng 8/2026 của UBND xã Tân Chi. Đây chỉ là dữ liệu khởi tạo
   lần đầu tiên (khi Firestore còn trống); sau đó toàn bộ dữ liệu
   được lưu trên Firebase Firestore — dùng chung, thời gian thực,
   cho mọi người mở trang này, dù ở máy tính hay điện thoại nào.
   ============================================================ */
const DEPARTMENTS = [
  {id:'vp',      name:'Văn phòng HĐND-UBND',                       short:'Văn phòng'},
  {id:'hcc',     name:'Trung tâm Phục vụ hành chính công',          short:'TT PV HCC'},
  {id:'vhxh',    name:'Phòng Văn hoá - Xã hội',                     short:'Phòng VHXH'},
  {id:'kt',      name:'Phòng Kinh tế',                              short:'Phòng Kinh tế'},

function unitOf(id){ return UNITS.find(u=>u.id===id); }
function unitType(id){ const u = unitOf(id); return u ? u.type : 'phong'; }
function roleOptionsFor(unitId){ return ROLE_OPTIONS_BY_TYPE[unitType(unitId)] || ROLE_OPTIONS_BY_TYPE.phong; }
/* Sắp xếp cán bộ theo Phòng, ban (đúng thứ tự UBND → Văn phòng → các phòng/trung tâm)
   rồi theo Chức vụ (lãnh đạo cao nhất trước, chuyên viên sau cùng), cùng chức vụ thì theo tên. */
function roleRank(s){
  const opts = roleOptionsFor(s.dept);
  const idx = opts.indexOf(s.chucVu);
  return idx === -1 ? opts.length : idx;
}
function groupStaffByUnit(staffArr){
  return UNITS.map(u=>{
    const members = staffArr.filter(s=>s.dept===u.id).slice().sort((a,b)=>{
      const r = roleRank(a) - roleRank(b);
      if(r !== 0) return r;
      return (a.name||'').localeCompare(b.name||'', 'vi');
    });
    return {unit:u, members};
  }).filter(g=>g.members.length);
}

function buildSeedTasks(){
  const counters = {};
  return RAW_TASKS.map(r=>{
    counters[r[0]] = (counters[r[0]]||0)+1;
    return {
      id: r[0]+'-'+counters[r[0]],
      dept: r[0],
      month: SEED_MONTH,
      linhVuc: r[1],
      noiDung: r[2],
      yeuCau: r[3],
      thoiHan: r[4],
      status: 'todo',
      chuTri: '', thucHien: '', phoiHop: '',
      diem: '', ghiChu: ''
    };
  });
}

/* ============================================================
   ĐĂNG NHẬP & PHÂN QUYỀN (theo chức danh — xem ghi chú cuối file
   về giới hạn bảo mật của cơ chế này)
   ============================================================ */
function getCurrentUser(){
  try{
    const raw = localStorage.getItem('ubnd_current_user');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function setCurrentUser(staffId){
  const s = state.staff.find(x=>x.id===staffId);
  if(!s) return;
  localStorage.setItem('ubnd_current_user', JSON.stringify({id:s.id, name:s.name, dept:s.dept, chucVu:s.chucVu}));
  localStorage.setItem('ubnd_myname', s.name); // đồng bộ với "Người cập nhật"
}
function clearCurrentUser(){
  localStorage.removeItem('ubnd_current_user');
}
function isLoggedIn(){ return !!getCurrentUser(); }

/* Mã hoá PIN đơn giản (không phải mã hoá bảo mật cấp doanh nghiệp — chỉ nhằm tránh lộ mã PIN
   dạng chữ rõ khi xem trực tiếp dữ liệu; xem ghi chú giới hạn bảo mật cuối file). */
function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
/* Lãnh đạo UBND xã & lãnh đạo Văn phòng: sửa được TẤT CẢ đơn vị.
   Lãnh đạo phòng/trung tâm & chuyên viên: chỉ sửa đơn vị của mình.
   Chưa đăng nhập: chỉ xem, không sửa được gì. */
function canEditDept(deptId){
  const u = getCurrentUser();
  if(!u) return false;
  if(FULL_ACCESS_TITLES.includes(u.chucVu)) return true;
  return u.dept === deptId;
}
/* Riêng lãnh đạo UBND xã (Chủ tịch / Phó Chủ tịch) — không gồm lãnh đạo Văn phòng —
   dùng cho các quyền đặc biệt: xem Nhật ký hoạt động, đặt mã PIN cho người khác. */
function isUBNDLeadership(){
  const u = getCurrentUser();
  return !!(u && u.dept === 'ubnd');
}
/* Quản lý danh sách cán bộ — CHỈ lãnh đạo mới được thêm/xoá cán bộ, không phải ai đăng nhập
   cũng được (tránh việc cấp dưới tự thêm/mạo danh cấp trên):
   - Lãnh đạo UBND xã: quản lý được cán bộ ở TẤT CẢ đơn vị.
   - Lãnh đạo từng đơn vị (Chánh/Phó Chánh VP, Trưởng/Phó Trưởng phòng, Giám đốc/Phó GĐ):
     chỉ quản lý được cán bộ trong ĐÚNG đơn vị của mình.
   - Chuyên viên: KHÔNG được thêm/xoá cán bộ (chỉ xem), kể cả cán bộ cùng đơn vị.
   - Danh sách còn trống hoàn toàn: cho thêm người đầu tiên (bootstrap), để có ai đó đăng nhập được. */
function canManageStaffFor(targetDeptId){
  if(!state.staff || state.staff.length === 0) return true;
  const u = getCurrentUser();
  if(!u) return false;
  if(isUBNDLeadership()) return true;
  const isUnitLeader = u.chucVu && u.chucVu !== 'Chuyên viên';
  return !!(isUnitLeader && u.dept === targetDeptId);
}
/* Có quản lý được cán bộ ở ÍT NHẤT một đơn vị nào đó không — dùng để quyết định
   có hiện form "Thêm cán bộ" hay không (đơn vị cụ thể được kiểm tra lại khi bấm Lưu). */
function canManageStaffAny(){
  if(!state.staff || state.staff.length === 0) return true;
  const u = getCurrentUser();
  if(!u) return false;
  if(isUBNDLeadership()) return true;
  return !!(u.chucVu && u.chucVu !== 'Chuyên viên');
}

/* ---- Người cập nhật (ưu tiên lấy từ tài khoản đã đăng nhập) ---- */
function getMyName(){
  const u = getCurrentUser();
  if(u) return u.name;
  let n = localStorage.getItem('ubnd_myname');
  if(!n){
    n = prompt('Nhập họ tên của bạn (để ghi nhận người cập nhật cho từng công việc — chỉ hỏi 1 lần trên máy này):', '') || 'Chưa rõ';
    localStorage.setItem('ubnd_myname', n);
  }
  return n;
}
function nowStr(){
  const d = new Date();
  return d.toLocaleString('vi-VN', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit', year:'numeric'});
}
/* Ghi 1 dòng vào Nhật ký hoạt động (giữ tối đa 300 dòng gần nhất để không phình dữ liệu) */
function logActivity(action, detail){
  if(!state.activityLog) state.activityLog = [];
  state.activityLog.unshift({ts: nowStr(), who: getMyName(), action, detail});
  if(state.activityLog.length > 300) state.activityLog.length = 300;
}

/* Ghi state hiện tại lên Firestore — mọi trình duyệt khác đang mở
   trang sẽ tự nhận được thay đổi này gần như ngay lập tức. */
async function persist(){
  if(CONFIG_CHUA_SET){
    console.warn('Chưa cấu hình Firebase — dữ liệu chỉ lưu tạm trong phiên này.');
    return;
  }
  try{
    isApplyingRemote = true; // bỏ qua 1 lần "vọng lại" từ chính mình
    await docRef.set(state);
  }catch(e){
    console.error('Lỗi lưu dữ liệu lên Firestore:', e);
    alert('Không lưu được lên máy chủ dùng chung. Kiểm tra kết nối mạng hoặc Quy tắc bảo mật Firestore (xem hướng dẫn).');
  }finally{
    setTimeout(()=>{ isApplyingRemote = false; }, 300);
  }
}

/* Lắng nghe realtime: mỗi khi có ai (kể cả chính mình) ghi dữ liệu,
   Firestore đẩy bản mới nhất về đây và giao diện tự vẽ lại. */
function subscribeRealtime(){
  docRef.onSnapshot(snap=>{
    if(isApplyingRemote) return; // vừa tự ghi xong, không cần vẽ lại 2 lần
    if(snap.exists){
      state = snap.data();
      firestoreReady = true;
      render();
    }
  }, err=>{
    console.error('Lỗi kết nối realtime:', err);
    document.getElementById('app').innerHTML =
      '<div class="empty-state"><div class="big">Không kết nối được máy chủ dữ liệu dùng chung</div>'+
      'Kiểm tra cấu hình Firebase và Quy tắc bảo mật Firestore (xem hướng dẫn triển khai).</div>';
  });
}

/* ---- Đếm lượt truy cập & lịch sử truy cập (ghi 1 lần mỗi khi mở trang, dùng transaction
   để cộng dồn chính xác kể cả khi nhiều người mở cùng lúc) ---- */
const SUPER_AUDITOR_NAME = 'Nguyễn Quốc Vương';
function isSuperAuditor(){
  const u = getCurrentUser();
  return !!(u && u.name && u.name.trim() === SUPER_AUDITOR_NAME);
}
async function recordVisit(){
  if(CONFIG_CHUA_SET || !db) return;
  try{
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(docRef);
      const data = snap.exists ? snap.data() : defaultState();
      const who = getCurrentUser() ? getCurrentUser().name : 'Khách (chưa đăng nhập)';
      const log = data.visitLog || [];
      log.unshift({who, ts: nowStr()});
      if(log.length > 500) log.length = 500;
      tx.update(docRef, {
        visitCount: (data.visitCount||0) + 1,
        visitLog: log
      });
    });
  }catch(e){
    console.error('Lỗi ghi lượt truy cập:', e);
  }
}

   HELPERS
   ============================================================ */
const STATUS_META = {
  todo:  {label:'Chưa thực hiện', cls:'st-todo'},
  doing: {label:'Đang thực hiện', cls:'st-doing'},
  done:  {label:'Hoàn thành',     cls:'st-done'},
  pause: {label:'Tạm dừng',       cls:'st-pause'}
};
function deptName(id){ const d = DEPARTMENTS.find(x=>x.id===id); return d? d.short : id; }
function deptFullName(id){ const d = DEPARTMENTS.find(x=>x.id===id); return d? d.name : id; }
function monthLabel(m){ if(!m) return ''; const [y,mo] = m.split('-'); return 'Tháng '+parseInt(mo,10)+'/'+y; }

function parseDeadlineDates(text){
  if(!text) return [];
  const re = /(\d{1,2})\/(\d{1,2})\/(\d{4})/g;
  const out = []; let m;
  while((m = re.exec(text))){
    out.push(new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10)));
  }
  return out;
}
/* Ưu tiên ngày hoàn thành dự kiến chọn từ lịch (hanHoanThanh, dạng YYYY-MM-DD);
   nếu chưa có thì suy ra từ chữ mô tả "Thời hạn" như trước (dữ liệu cũ). */
function getDeadlineDate(task){
  if(task.hanHoanThanh){
    const d = new Date(task.hanHoanThanh+'T00:00:00');
    if(!isNaN(d.getTime())) return d;
  }
  const dates = parseDeadlineDates(task.thoiHan);
  if(!dates.length) return null;
  return new Date(Math.max(...dates.map(d=>d.getTime())));
}
function formatVNDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function isOverdue(task){
  if(task.status === 'done') return false;
  const latest = getDeadlineDate(task);
  if(!latest) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return latest < today;
}
function daysUntil(task){
  const latest = getDeadlineDate(task);
  if(!latest) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((latest-today)/86400000);
}
/* Sắp xếp công việc theo thứ tự thời hạn hoàn thành gần nhất trước;
   công việc "Thường xuyên" / chưa có mốc ngày cụ thể được xếp xuống cuối. */
function sortByDeadline(tasks){
  return [...tasks].sort((a,b)=>{
    const da = getDeadlineDate(a), db = getDeadlineDate(b);
    if(da && db) return da - db;
    if(da && !db) return -1;
    if(!da && db) return 1;
    return 0;
  });
}
function tasksForMonth(month){ return state.tasks.filter(t=>t.month===month); }
function statsFor(tasks){
  const total = tasks.length;
  const done = tasks.filter(t=>t.status==='done').length;
  const doing = tasks.filter(t=>t.status==='doing').length;
  const overdue = tasks.filter(isOverdue).length;
  const pct = total? Math.round(done/total*100) : 0;
  return {total, done, doing, overdue, pct};
}
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const chartInstances = {};
function killChart(id){ if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; } }
function afterRender(){
  try{
    if(typeof Chart === 'undefined'){
      ['chart-overview-bar','chart-overview-pie','chart-report-year'].forEach(id=>{
        const el = document.getElementById(id);
        if(el && el.parentElement) el.parentElement.insertAdjacentHTML('beforeend', '<div style="font-size:11.5px; color:var(--ink-faint); text-align:center; padding:8px;">Không tải được thư viện biểu đồ (kiểm tra kết nối mạng)</div>');
      });
      return;
    }
  renderChartsInner();
  }catch(e){ console.error('Lỗi hiển thị biểu đồ:', e); }
}
function renderChartsInner(){
  const barEl = document.getElementById('chart-overview-bar');
  if(barEl){
    killChart('overview-bar');
    const tasks = tasksForMonth(state.currentMonth);
    const labels = DEPARTMENTS.map(d=>d.short);
    const totals = DEPARTMENTS.map(d=>tasks.filter(t=>t.dept===d.id).length);
    const dones = DEPARTMENTS.map(d=>tasks.filter(t=>t.dept===d.id && t.status==='done').length);
    const overdues = DEPARTMENTS.map(d=>tasks.filter(t=>t.dept===d.id).filter(isOverdue).length);
    chartInstances['overview-bar'] = new Chart(barEl, {
      type:'bar',
      data:{ labels, datasets:[
        {label:'Tổng số', data:totals, backgroundColor:'#D9DFE7', borderRadius:4},
        {label:'Hoàn thành', data:dones, backgroundColor:'#2C7A5B', borderRadius:4},
        {label:'Quá hạn', data:overdues, backgroundColor:'#B3352B', borderRadius:4}
      ]},
      options:{ responsive:true, plugins:{title:{display:true, text:'Khối lượng công việc theo phòng, ban'}, legend:{position:'bottom'}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}} }
    });
  }
  const pieEl = document.getElementById('chart-overview-pie');
  if(pieEl){
    killChart('overview-pie');
    const tasks = tasksForMonth(state.currentMonth);
    const counts = Object.keys(STATUS_META).map(k=>tasks.filter(t=>t.status===k).length);
    chartInstances['overview-pie'] = new Chart(pieEl, {
      type:'doughnut',
      data:{ labels: Object.values(STATUS_META).map(v=>v.label), datasets:[{
        data: counts,
        backgroundColor:['#8B96A8','#2E5C8A','#2C7A5B','#B97B1F']
      }]},
      options:{ responsive:true, plugins:{title:{display:true, text:'Phân bổ trạng thái'}, legend:{position:'bottom'}} }
    });
  }
  const yearEl = document.getElementById('chart-report-year');
  if(yearEl){
    killChart('report-year');
    const rows = groupByYear();
    chartInstances['report-year'] = new Chart(yearEl, {
      type:'bar',

        {label:'Hoàn thành', data: rows.map(r=>r.done), backgroundColor:'#A9822F', borderRadius:4}
      ]},
      options:{ responsive:true, plugins:{title:{display:true, text:'Xu hướng theo năm'}, legend:{position:'bottom'}}, scales:{y:{beginAtZero:true, ticks:{precision:0}}} }
    });
  }
}

/* ---------------- OVERVIEW ---------------- */
function renderOverview(){
  const tasks = tasksForMonth(state.currentMonth);
  const s = statsFor(tasks);
  const urgent = tasks
    .filter(t=>t.status!=='done')
    .map(t=>({t, d:daysUntil(t)}))
    .filter(x=> x.d!==null && x.d<=3)
    .sort((a,b)=> a.d-b.d)
    .slice(0,12);

  const deptRows = DEPARTMENTS.map(d=>{
    const dt = tasks.filter(t=>t.dept===d.id);
    const st = statsFor(dt);
    return `<div class="dept-bar-row">
      <div class="dept-bar-name">${d.short}</div>
      <div class="dept-bar-track"><div class="dept-bar-fill" style="width:${st.pct}%"></div></div>
      <div class="dept-bar-pct">${st.done}/${st.total} việc · ${st.pct}%</div>
    </div>`;
  }).join('');

/* ---------------- DEPT TAB ---------------- */
function renderDeptTab(deptId){
  const f = uiFilters[deptId] || (uiFilters[deptId] = {search:'', linhVuc:'', status:''});
  let tasks = state.tasks.filter(t=>t.dept===deptId && t.month===state.currentMonth);
  const linhVucOptions = [...new Set(tasks.map(t=>t.linhVuc))];

  if(f.search){
    const q = f.search.toLowerCase();
    tasks = tasks.filter(t=> (t.noiDung+' '+t.yeuCau+' '+t.linhVuc).toLowerCase().includes(q));
  }
  if(f.linhVuc) tasks = tasks.filter(t=>t.linhVuc===f.linhVuc);
  if(f.status) tasks = tasks.filter(t=>t.status===f.status);
  tasks = sortByDeadline(tasks);

  const s = statsFor(state.tasks.filter(t=>t.dept===deptId && t.month===state.currentMonth));

  return `
  <div class="section-title" style="margin-top:0;">
    <h2>${deptFullName(deptId)}</h2>
    <span class="hint">${s.total} công việc · ${s.done} hoàn thành (${s.pct}%) · ${s.overdue} quá hạn</span>
  </div>
  <div class="toolbar">
    <input type="text" placeholder="Tìm công việc…" data-action="filter-search" data-dept="${deptId}" value="${escapeHtml(f.search)}">
    <select data-action="filter-linhvuc" data-dept="${deptId}">
      <option value="">Tất cả lĩnh vực</option>
      ${linhVucOptions.map(lv=>`<option value="${escapeHtml(lv)}" ${f.linhVuc===lv?'selected':''}>${escapeHtml(lv)}</option>`).join('')}
    </select>
    <select data-action="filter-status" data-dept="${deptId}">
      <option value="">Tất cả trạng thái</option>
      ${Object.entries(STATUS_META).map(([k,v])=>`<option value="${k}" ${f.status===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
    <div class="spacer"></div>
    ${canEditDept(deptId) ? `<button class="btn gold" data-action="open-add-task" data-dept="${deptId}">➕ Thêm công việc</button>` : ''}
  </div>
  ${renderTaskTable(tasks)}
  `;
}

function renderKetQuaCell(t){
  if(!t.minhChung || !t.minhChung.length) return '<span style="color:var(--ink-faint)">—</span>';
  return t.minhChung.map(f=>`
    <div class="kq-file-row">
      <span class="mc-icon">📄</span>
      <span class="kq-file-name" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
      <a href="${f.url}" target="_blank" rel="noopener noreferrer" class="btn small kq-btn" title="Xem trực tiếp">👁️ Xem</a>
      <a href="${f.url}" download="${escapeHtml(f.name)}" class="btn small kq-btn" title="Tải về máy">⬇️ Tải về</a>
    </div>`).join('');
}
function renderTaskTable(tasks){
  if(!tasks.length){
    return `<div class="table-wrap"><div class="empty-state"><div class="big">Chưa có công việc nào</div>Nhấn "Thêm công việc" để bắt đầu theo dõi.</div></div>`;
  }
  const rows = tasks.map((t,i)=>{
    const overdue = isOverdue(t);
    const editable = canEditDept(t.dept);
    return `
    <tr class="${overdue?'overdue':''}">
      <td class="col-tt">${i+1}</td>
      <td class="col-linhvuc">${escapeHtml(t.linhVuc)}</td>
      <td>
        <div class="task-name">${escapeHtml(t.noiDung)}</div>
        ${t.yeuCau? `<div class="task-req">${escapeHtml(t.yeuCau)}</div>` : ''}
        ${t.ghiChu? `<div class="note">Ghi chú: ${escapeHtml(t.ghiChu)}</div>` : ''}
        ${t.lastEditedBy? `<div class="note" style="color:var(--ink-faint);">Cập nhật lần cuối: ${escapeHtml(t.lastEditedBy)} · ${escapeHtml(t.lastEditedAt||'')}</div>` : ''}
      </td>
      <td class="col-deadline">${escapeHtml(t.thoiHan)||'—'}${t.hanHoanThanh?`<div class="mono" style="margin-top:4px; color:var(--ink-soft); font-size:11.5px;">📅 ${formatVNDate(t.hanHoanThanh)}</div>`:''}${overdue?'<span class="badge overdue-flag">Quá hạn</span>':''}</td>
      <td>
        ${editable ? `
        <select class="status-select" data-action="update-status" data-id="${t.id}">
          ${Object.entries(STATUS_META).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v.label}</option>`).join('')}
        </select>` : `<span class="badge ${STATUS_META[t.status].cls}"><span class="badge-dot"></span>${STATUS_META[t.status].label}</span>`}
      </td>
      <td class="col-people">${escapeHtml(t.chuTri)||'<span style="color:var(--ink-faint)">—</span>'}</td>
      <td class="col-people">${escapeHtml(t.thucHien)||'<span style="color:var(--ink-faint)">—</span>'}</td>
      <td class="col-people">${escapeHtml(t.phoiHop)||'<span style="color:var(--ink-faint)">—</span>'}</td>
      <td class="mono" style="text-align:center; width:50px;">${escapeHtml(t.diem)||'—'}</td>
      <td class="col-ketqua">${renderKetQuaCell(t)}${editable? `<button type="button" class="btn small" data-action="quick-upload-kq" data-id="${t.id}" style="margin-top:4px;">➕ Thêm kết quả</button>`:''}</td>
      <td class="col-actions">
        ${editable ? `
        <button class="btn small" data-action="open-edit-task" data-id="${t.id}">✏️ Sửa</button>
        <button class="btn small danger-outline" data-action="delete-task" data-id="${t.id}">🗑️ Xoá</button>` : `<span class="readonly-note">Chỉ xem</span>`}
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="table-wrap">
    <table>
      <thead><tr>
        <th class="col-tt">TT</th>
        <th class="col-linhvuc">Lĩnh vực</th>
        <th>Nhiệm vụ / công việc</th>
        <th class="col-deadline">Thời hạn</th>
        <th>Trạng thái</th>
        <th class="col-people">Chủ trì</th>
        <th class="col-people">TH chính</th>
        <th class="col-people">Phối hợp</th>
        <th style="width:50px;">Điểm</th>
        <th class="col-ketqua">Kết quả</th>
        <th class="col-actions no-print">​</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

/* ---------------- STAFF ---------------- */
function unitShort(id){ const u = UNITS.find(x=>x.id===id); return u ? u.short : id; }
function renderStaff(){
  const curUser = getCurrentUser();
  const canManageAny = canManageStaffAny();
  const staffItemHtml = (s)=>{
    const isLeader = s.chucVu && s.chucVu !== 'Chuyên viên';
    const canSetPin = isUBNDLeadership() || (curUser && curUser.id === s.id);
    const canDeleteThis = canManageStaffFor(s.dept);
    return `
    <div class="staff-item">
      <div class="staff-avatar">${escapeHtml((s.name||'?').trim().split(' ').slice(-1)[0][0]||'?')}</div>
      <div class="staff-info">
        <div class="staff-name">${escapeHtml(s.name)} <span class="staff-role-pill ${isLeader?'leader':'staffmember'}">${escapeHtml(s.chucVu)||'—'}</span></div>
        <div class="staff-meta">${s.pinHash?'🔒 Đã đặt PIN':'⚪ Chưa đặt PIN'}</div>
      </div>
      ${canSetPin ? `<button class="btn small" data-action="set-pin" data-id="${s.id}">🔑 ${s.pinHash?'Đổi PIN':'Đặt PIN'}</button>` : ''}
      ${canDeleteThis ? `<button class="btn small danger-outline" data-action="delete-staff" data-id="${s.id}">🗑️ Xoá</button>` : ''}
    </div>`;
  };
  const groups = groupStaffByUnit(state.staff);
  const list = groups.length ? groups.map(g=>`
    <div class="staff-unit-group">
      <div class="staff-unit-heading"><span class="pill-dept">${escapeHtml(g.unit.short)}</span></div>
      ${g.members.map(staffItemHtml).join('')}
    </div>`).join('') : `<div class="empty-state"><div class="big">Chưa có cán bộ</div>Thêm danh sách cán bộ để phân công chủ trì, thực hiện chính, phối hợp cho từng công việc.</div>`;

  // Đơn vị được phép chọn khi thêm: lãnh đạo UBND chọn được tất cả; lãnh đạo đơn vị chỉ
  // chọn được đúng đơn vị mình (không thêm được cho đơn vị khác/cấp trên); danh sách
  // còn trống (bootstrap) thì cho chọn tất cả để có người đầu tiên đăng nhập.
  const allowedUnitsForAdd = (!state.staff.length || isUBNDLeadership())
    ? UNITS
    : UNITS.filter(u=>u.id === (curUser ? curUser.dept : null));
  const firstUnit = allowedUnitsForAdd[0] || UNITS[0];
  const addFormHtml = canManageAny ? `
    <div class="card">
      <h3 style="font-size:14px; margin-bottom:12px;">Thêm cán bộ</h3>
      ${!isUBNDLeadership() && state.staff.length ? `<p style="font-size:11.5px; color:var(--ink-faint); margin:-4px 0 10px;">Bạn chỉ thêm được cán bộ cho đơn vị của mình. Chỉ Lãnh đạo UBND xã mới thêm được cho các đơn vị khác.</p>` : ''}
      <div class="modal-body" style="padding:0;">
        <div class="field"><label>Họ và tên</label><input type="text" id="staff-name" placeholder="Nguyễn Văn A"></div>
        <div class="field">
          <label>Đơn vị</label>
          <select id="staff-dept" data-action="staffunit-change">${allowedUnitsForAdd.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Chức danh</label>
          <select id="staff-chucvu">${roleOptionsFor(firstUnit.id).map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('')}</select>
        </div>
        <button class="btn gold" data-action="add-staff" style="justify-self:start;">➕ Thêm cán bộ</button>
      </div>
      <h3 style="font-size:14px; margin:22px 0 8px;">Nhập nhanh nhiều cán bộ (chức danh: Chuyên viên)</h3>
      <div class="field">
        <label>Mỗi dòng một người: Họ tên - Chức danh (tuỳ chọn, để trống = Chuyên viên)</label>
        <textarea id="staff-bulk" placeholder="Nguyễn Văn A
Trần Thị B - Phó Trưởng phòng"></textarea>
      </div>
      <div class="field-row">
        <div class="field"><label>Áp dụng cho đơn vị</label>
          <select id="staff-bulk-dept">${allowedUnitsForAdd.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select>
        </div>
        <div style="align-self:end;"><button class="btn gold" data-action="add-staff-bulk">➕ Thêm hàng loạt</button></div>
      </div>
    </div>` : `
    <div class="card">
      <div class="empty-state"><div class="big">🔒 Không có quyền thêm cán bộ</div>${curUser ? 'Chỉ lãnh đạo đơn vị hoặc Lãnh đạo UBND xã mới được thêm/xoá cán bộ. Chuyên viên chỉ xem được danh sách.' : 'Vui lòng đăng nhập. Khách chỉ xem được danh sách.'}</div>
    </div>`;
  return `
  <div class="section-title" style="margin-top:0;"><h2>Danh sách cán bộ</h2><span class="hint">Dùng để phân công chủ trì / thực hiện / phối hợp và đăng nhập</span></div>
  <div class="staff-grid">
    ${addFormHtml}
    <div class="card">
      <h3 style="font-size:14px; margin-bottom:12px;">Toàn bộ cán bộ (${state.staff.length})</h3>
      <div class="staff-list">${list}</div>
    </div>
  </div>`;
}

/* ---------------- REPORT ---------------- */
function renderReport(){
  const cumulative = state.tasks;
  const monthTasks = tasksForMonth(state.currentMonth);

  function tableFor(tasks, title, hint){
    const rows = DEPARTMENTS.map(d=>{
      const dt = tasks.filter(t=>t.dept===d.id);
      const s = statsFor(dt);
      return `<tr>
        <td style="font-weight:600;">${d.name}</td>
        <td class="mono" style="text-align:center;">${s.total}</td>
        <td class="mono" style="text-align:center; color:var(--green);">${s.done}</td>
        <td class="mono" style="text-align:center; color:var(--blue);">${s.doing}</td>
        <td class="mono" style="text-align:center; color:var(--danger);">${s.overdue}</td>
        <td style="width:160px;">
          <div class="dept-bar-track"><div class="dept-bar-fill" style="width:${s.pct}%"></div></div>
        </td>
        <td class="mono" style="text-align:center;">${s.pct}%</td>
      </tr>`;
    }).join('');
    const total = statsFor(tasks);
    return `
    <div class="section-title"><h2>${title}</h2><span class="hint">${hint}</span></div>
    <div class="table-wrap">
      <table style="min-width:760px;">
        <thead><tr>
          <th>Phòng, ban</th><th style="text-align:center;">Tổng số</th><th style="text-align:center;">Hoàn thành</th>
          <th style="text-align:center;">Đang thực hiện</th><th style="text-align:center;">Quá hạn</th><th>Tiến độ</th><th style="text-align:center;">Tỷ lệ</th>
        </tr></thead>
        <tbody>${rows}
          <tr style="background:var(--surface-2); font-weight:700;">
            <td>TỔNG CỘNG</td>
            <td class="mono" style="text-align:center;">${total.total}</td>
            <td class="mono" style="text-align:center; color:var(--green);">${total.done}</td>
            <td class="mono" style="text-align:center; color:var(--blue);">${total.doing}</td>
            <td class="mono" style="text-align:center; color:var(--danger);">${total.overdue}</td>
            <td><div class="dept-bar-track"><div class="dept-bar-fill" style="width:${total.pct}%"></div></div></td>
            <td class="mono" style="text-align:center;">${total.pct}%</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  return `
  <div class="toolbar no-print">
    <div class="spacer"></div>
    <button class="btn gold" data-action="export-excel">📊 Xuất Dashboard Excel đầy đủ</button>
    <button class="btn" data-action="print-report">🖨️ In / Xuất PDF</button>
  </div>
  ${tableFor(monthTasks, 'Báo cáo theo tháng', monthLabel(state.currentMonth))}
  ${tableFor(cumulative, 'Tổng hợp đến thời điểm hiện tại', 'Tất cả các kỳ (' + state.months.map(monthLabel).join(', ') + ')')}
  <canvas id="chart-report-year" height="90" class="no-print" style="margin-top:10px;"></canvas>
  ${renderStatsByYear()}
  ${renderStatsByField(monthTasks)}
  ${renderStatsByAssignee(monthTasks)}
  `;
}

/* ---------------- TÍNH TOÁN THỐNG KÊ DÙNG CHUNG (Báo cáo + Excel) ---------------- */
function groupByField(tasks){
  const map = new Map();
  tasks.forEach(t=>{
    const key = deptName(t.dept) + ' — ' + (t.linhVuc || '(chưa phân loại)');
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(t);
  });
  return [...map.entries()].map(([key,list])=>({key, ...statsFor(list)})).sort((a,b)=>b.total-a.total);
}
/* Đề xuất công thức KPI cá nhân (thang 100 điểm):
   50% × Tỷ lệ hoàn thành công việc được giao
   30% × Tỷ lệ KHÔNG để quá hạn (đúng tiến độ)
   20% × Điểm chất lượng do lãnh đạo chấm (thang 10, quy đổi 100) — nếu chưa được chấm điểm nào,
        2 tiêu chí đầu được tính lại theo tỷ trọng 62,5% / 37,5% để vẫn ra thang 100 điểm đầy đủ. */
function computeKPI(list){
  const s = statsFor(list);
  const dungHan = s.total ? Math.round((1 - s.overdue/s.total) * 100) : 100;
  const scored = list.filter(t=> t.diem!=='' && t.diem!=null && !isNaN(parseFloat(t.diem)));
  const avgDiem = scored.length ? scored.reduce((a,t)=>a+parseFloat(t.diem),0)/scored.length : null;
  if(avgDiem===null) return Math.round(s.pct*0.625 + dungHan*0.375);
  return Math.round(s.pct*0.5 + dungHan*0.3 + Math.min(avgDiem,10)*10*0.2);
}
function groupByAssignee(tasks){
  const map = new Map();
  tasks.forEach(t=>{
    const name = (t.thucHien||'').trim();
    if(!name) return;
    if(!map.has(name)) map.set(name, []);
    map.get(name).push(t);
  });
  return [...map.entries()].map(([name,list])=>{
    const staffInfo = state.staff.find(x=>x.name===name);
    return {name, unit: staffInfo? unitShort(staffInfo.dept) : deptName(list[0].dept), kpi: computeKPI(list), ...statsFor(list)};
  }).sort((a,b)=>b.total-a.total);
}
function groupByYear(){
  const map = new Map();
  state.tasks.forEach(t=>{
    const year = (t.month||'').split('-')[0] || '(?)';
    if(!map.has(year)) map.set(year, []);
    map.get(year).push(t);
  });
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([year,list])=>({year, ...statsFor(list)}));
}

/* ---------------- XUẤT EXCEL (ExcelJS — có định dạng, màu sắc, thanh tiến độ) ---------------- */
function xlsxReady(){ return typeof ExcelJS !== 'undefined'; }
async function downloadWorkbook(wb, filename){
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if(isLoggedIn()){ logActivity('Xuất Excel', filename); persist(); } // khách xem không ghi vết lên dữ liệu dùng chung
}
/* Tải file .xlsx đơn giản bằng SheetJS — dùng làm phương án dự phòng khi ExcelJS
   (thư viện tạo file có định dạng màu sắc) không tải được hoặc gặp lỗi, để việc
   xuất Excel KHÔNG BAO GIỜ thất bại hoàn toàn, dù có thể mất phần định dạng màu. */
function downloadWithSheetJS(sheets, filename){
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, aoa])=>{
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), name.slice(0,31));
  });
  XLSX.writeFile(wb, filename);
  if(isLoggedIn()){ logActivity('Xuất Excel (chế độ đơn giản)', filename); persist(); }
}
function minhChungText(t){
  return (t.minhChung && t.minhChung.length) ? t.minhChung.map(f=>f.name+': '+f.url).join('; ') : '';
}

  state.tasks.filter(t=>t.dept===d.id).forEach((t,i)=>{
    rows.push([monthLabel(t.month), i+1, t.linhVuc, t.noiDung, t.yeuCau, t.thoiHan, formatVNDate(t.hanHoanThanh), STATUS_META[t.status]?.label||t.status, t.chuTri, t.thucHien, t.phoiHop, t.diem, t.ghiChu, minhChungText(t)]);

  if(typeof XLSX === 'undefined'){ alert('Không tải được thư viện xuất Excel (cả 2 phương án). Kiểm tra kết nối mạng rồi thử lại.'); return; }

function styleHeader(row){
  row.eachCell(cell=>{
    cell.font = {name:'Arial', size:10, bold:true, color:{argb:'FFFFFFFF'}};
    cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF7A1F2E'}};
    cell.alignment = {vertical:'middle', horizontal:'center', wrapText:true};
    cell.border = {top:{style:'thin',color:{argb:'FFD9DFE7'}}, bottom:{style:'thin',color:{argb:'FFD9DFE7'}}, left:{style:'thin',color:{argb:'FFD9DFE7'}}, right:{style:'thin',color:{argb:'FFD9DFE7'}}};
  });
  row.height = 22;
}
function styleBody(ws, startRow, endRow, ncols){
  for(let r=startRow;r<=endRow;r++){
    const row = ws.getRow(r);
    for(let c=1;c<=ncols;c++){
      const cell = row.getCell(c);
      cell.font = {name:'Arial', size:10};
      cell.border = {top:{style:'thin',color:{argb:'FFE4E1D8'}}, bottom:{style:'thin',color:{argb:'FFE4E1D8'}}, left:{style:'thin',color:{argb:'FFE4E1D8'}}, right:{style:'thin',color:{argb:'FFE4E1D8'}}};
      if(r % 2 === 0) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFF7F8FA'}};
    }
  }
}
function addTitle(ws, text, ncols){
  ws.mergeCells(1,1,1,ncols);
  const c = ws.getCell(1,1);
  c.value = text;
  c.font = {name:'Arial', size:13, bold:true, color:{argb:'FFFFFFFF'}};
  c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF141B2C'}};
  c.alignment = {vertical:'middle', horizontal:'left', indent:1};
  ws.getRow(1).height = 26;
  for(let c2=1;c2<=ncols;c2++) ws.getCell(1,c2).fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF141B2C'}};
}
/* Thanh tiến độ trực quan mô phỏng bằng ký tự khối — hiện ngay trong ô, không cần vẽ biểu đồ */
function barCell(pct){
  const n = Math.round(Math.max(0,Math.min(100,pct))/10);
  return '█'.repeat(n) + '░'.repeat(10-n) + '  ' + pct + '%';
}

function buildDeptSheet(wb, title, ncols=6){

}

    r++;
  });
  if(r>4) ws.addConditionalFormatting({ref:`G4:G${r-1}`, rules:[{type:'colorScale', color:['FFC0392B','FFF1C40F','FF2C7A5B']}]});
  styleBody(ws, 4, r-1, 7);
  ws.views = [{state:'frozen', ySplit:3}];
  return ws;
}
function addYearStatsSheet(wb){
  const ws = wb.addWorksheet('Theo nam');
  ws.columns = [{width:14},{width:14},{width:14},{width:14},{width:14}];
  addTitle(ws, 'THỐNG KÊ TỔNG HỢP THEO NĂM', 5);
  const headRow = ws.getRow(3);
  ['Năm','Tổng số','Hoàn thành','Quá hạn','Tỷ lệ %'].forEach((h,i)=>headRow.getCell(i+1).value=h);
  styleHeader(headRow);
  let r = 4;
  groupByYear().forEach(y=>{
    const row = ws.getRow(r);
    row.getCell(1).value=y.year; row.getCell(2).value=y.total; row.getCell(3).value=y.done; row.getCell(4).value=y.overdue;
    row.getCell(5).value=y.pct/100; row.getCell(5).numFmt='0.0%';
    [1,2,3,4,5].forEach(c=>row.getCell(c).alignment={horizontal:'center'});
    r++;
  });
  if(r>4) ws.addConditionalFormatting({ref:`E4:E${r-1}`, rules:[{type:'dataBar', minLength:0, maxLength:100, gradient:true, border:false, color:{argb:'FF2E5C8A'}}]});
  styleBody(ws, 4, r-1, 5);
  return ws;
}

function formatFileSize(bytes){
  if(!bytes) return '';
  if(bytes < 1024*1024) return Math.round(bytes/1024)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}
function renderMinhChungList(){
  if(!modalMinhChung.length) return '<p style="font-size:12px; color:var(--ink-faint); margin:4px 0;">Chưa có kết quả nào.</p>';
  return modalMinhChung.map((f,i)=>`
    <div class="minhchung-chip">
      <span class="mc-icon">📄</span>
      <a href="${f.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(f.name)}</a>
      <span class="mc-size">${formatFileSize(f.size)}</span>
      <button type="button" class="mc-remove" data-action="remove-minhchung" data-index="${i}" title="Gỡ file này">✕</button>
    </div>`).join('');
}
async function handleMinhChungFileSelected(file){
  if(!storageRef){
    alert('Chưa dùng được tính năng tải file: Firebase Storage chưa được bật hoặc chưa nâng cấp gói Blaze. Xem hướng dẫn triển khai để bật.');
    return;
  }
  if(file.size > 15*1024*1024){
    alert('File "'+file.name+'" nặng quá 15MB. Vui lòng chọn file nhỏ hơn hoặc nén lại.');
    return;
  }
  const listEl = document.getElementById('minhchung-list');
  if(listEl) listEl.insertAdjacentHTML('beforeend', '<p id="mc-uploading" style="font-size:12px; color:var(--gold);">⏳ Đang tải "'+escapeHtml(file.name)+'" lên…</p>');
  try{
    const safeName = file.name.replace(/[^\w.\-]+/g, '_');
    const path = 'ket-qua/' + Date.now() + '_' + safeName;
    const ref = storageRef.ref().child(path);
    const snap = await ref.put(file);
    const url = await snap.ref.getDownloadURL();
    modalMinhChung.push({name:file.name, url, size:file.size, uploadedAt: nowStr(), uploadedBy: getMyName()});
  }catch(e){
    console.error('Lỗi tải file kết quả:', e);
    alert('Không tải được file lên. Kiểm tra kết nối mạng, hoặc Firebase Storage/Quy tắc bảo mật chưa thiết lập đúng hướng dẫn.');
  }finally{
    const up = document.getElementById('mc-uploading');
    if(up) up.remove();
    const listEl2 = document.getElementById('minhchung-list');
    if(listEl2) listEl2.innerHTML = renderMinhChungList();
  }
}
/* Tải nhanh 1 file kết quả trực tiếp cho 1 công việc, KHÔNG cần mở hộp thoại sửa —
   dùng cho nút "+ Thêm kết quả" trên bảng và khi đổi trạng thái sang "Hoàn thành". */
function quickUploadForTask(taskId){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*,application/pdf,.doc,.docx,.xls,.xlsx';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async ()=>{
    const file = input.files && input.files[0];
    if(input.parentNode) input.parentNode.removeChild(input);
    if(!file) return; // người dùng bấm Cancel — không tải gì cả, không sao
    if(!storageRef){
      alert('Chưa dùng được tính năng tải file: Firebase Storage chưa được bật hoặc chưa nâng cấp gói Blaze.');
      return;
    }
    if(file.size > 15*1024*1024){
      alert('File "'+file.name+'" nặng quá 15MB. Vui lòng chọn file nhỏ hơn hoặc nén lại.');
      return;
    }
    try{
      const safeName = file.name.replace(/[^\w.\-]+/g, '_');
      const path = 'ket-qua/' + Date.now() + '_' + safeName;
      const ref = storageRef.ref().child(path);
      const snap = await ref.put(file);
      const url = await snap.ref.getDownloadURL();
      const t = state.tasks.find(x=>x.id===taskId);
      if(t){
        if(!t.minhChung) t.minhChung = [];
        t.minhChung.push({name:file.name, url, size:file.size, uploadedAt: nowStr(), uploadedBy: getMyName()});
        t.lastEditedBy = getMyName(); t.lastEditedAt = nowStr();
        logActivity('Thêm kết quả', `[${deptName(t.dept)}] ${t.noiDung}: ${file.name}`);
        await persist(); render();
      }
    }catch(e){
      console.error('Lỗi tải file kết quả:', e);
      alert('Không tải được file lên. Kiểm tra kết nối mạng, hoặc Firebase Storage/Quy tắc bảo mật chưa thiết lập đúng hướng dẫn.');
    }
  });
  input.click();
}

document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='set-tab'){ uiTab = el.dataset.tab; render(); return; }
  if(action==='open-add-task'){ editingTaskId=null; modalDeptDefault = el.dataset.dept; modalMinhChung=[]; modalMode='task'; render(); return; }
  if(action==='open-edit-task'){
    editingTaskId = el.dataset.id;
    const t0 = state.tasks.find(x=>x.id===editingTaskId);
    modalMinhChung = (t0 && t0.minhChung) ? t0.minhChung.slice() : [];
    modalMode='task'; render(); return;
  }
  if(action==='close-modal' || action==='close-modal-overlay'){
    if(action==='close-modal-overlay' && e.target !== el) return;
    modalMode=null; editingTaskId=null; loginTargetId=null; render(); return;
  }
  if(action==='pick-minhchung'){
    const inp = document.getElementById('f-minhchung-input');
    if(inp) inp.click();
    return;
  }
  if(action==='quick-upload-kq'){
    quickUploadForTask(el.dataset.id);
    return;
  }
  if(action==='remove-minhchung'){
    const idx = parseInt(el.dataset.index, 10);
    if(!isNaN(idx)) modalMinhChung.splice(idx, 1);
    const listEl = document.getElementById('minhchung-list');
    if(listEl) listEl.innerHTML = renderMinhChungList();
    return;
  }
  if(action==='open-newmonth'){ modalMode='newmonth'; render(); return; }
  if(action==='open-login'){ modalMode='login'; loginTargetId=null; render(); return; }
  if(action==='do-login'){
    const s = state.staff.find(x=>x.id===el.dataset.id);
    if(!s) return;
    if(s.pinHash){
      loginTargetId = s.id;
      render();
    } else {
      setCurrentUser(s.id);
      logActivity('Đăng nhập', `${s.name} (${s.chucVu})`);
      persist();
      modalMode=null; loginTargetId=null;
      render();
    }
    return;
  }
  if(action==='login-back'){ loginTargetId=null; render(); return; }
  if(action==='login-pin-submit'){
    const s = state.staff.find(x=>x.id===el.dataset.id);
    const val = document.getElementById('pin-input').value.trim();
    if(!s) return;
    if(simpleHash(val) !== s.pinHash){
      alert('Sai mã PIN. Vui lòng thử lại.');
      return;
    }
    setCurrentUser(s.id);
    logActivity('Đăng nhập', `${s.name} (${s.chucVu})`);
    await persist();
    modalMode=null; loginTargetId=null;
    render();
    return;
  }
  if(action==='set-pin'){
    const s = state.staff.find(x=>x.id===el.dataset.id);
    if(!s) return;
    const cur = getCurrentUser();
    const allowed = isUBNDLeadership() || (cur && cur.id === s.id);
    if(!allowed){
      alert('Chỉ Lãnh đạo UBND xã hoặc chính cán bộ đó mới được đặt/đổi mã PIN cho tài khoản này.');
      return;
    }
    const pin = prompt(`Đặt mã PIN mới (4 số) cho ${s.name}. Để trống để bỏ mã PIN.`, '');
    if(pin === null) return;
    if(pin === ''){ s.pinHash = ''; }
    else if(!/^\d{4}$/.test(pin)){ alert('Mã PIN phải gồm đúng 4 chữ số.'); return; }
    else { s.pinHash = simpleHash(pin); }
    await persist(); render();
    return;
  }
  if(action==='logout'){
    if(confirm('Đổi sang người dùng khác? Bạn sẽ cần chọn lại tên để tiếp tục chỉnh sửa.')){
      clearCurrentUser();
      render();
    }
    return;
  }

  if(action==='delete-task'){
    const t = state.tasks.find(x=>x.id===el.dataset.id);
    if(t && !canEditDept(t.dept)){ alert('Bạn không có quyền xoá công việc của đơn vị này.'); return; }
    if(confirm('Xoá công việc này khỏi danh sách theo dõi?')){
      if(t) logActivity('Xoá công việc', `[${deptName(t.dept)}] ${t.noiDung}`);
      state.tasks = state.tasks.filter(t=>t.id!==el.dataset.id);
      modalMode=null; editingTaskId=null;
      await persist(); render();
    }
    return;
  }

  if(action==='save-task'){
    const dept = document.getElementById('f-dept').value;
    if(!canEditDept(dept)){ alert('Bạn không có quyền chỉnh sửa công việc của đơn vị này. Vui lòng đăng nhập đúng tài khoản.'); return; }
    const coopChecked = Array.from(document.getElementById('f-phoihop').selectedOptions).map(o=>o.value);
    const data = {
      dept,
      linhVuc: document.getElementById('f-linhvuc').value.trim(),
      noiDung: document.getElementById('f-noidung').value.trim(),
      yeuCau: document.getElementById('f-yeucau').value.trim(),
      thoiHan: document.getElementById('f-thoihan').value.trim(),
      hanHoanThanh: document.getElementById('f-handoan').value,
      status: document.getElementById('f-status').value,
      chuTri: document.getElementById('f-chutri').value,
      thucHien: document.getElementById('f-thuchien').value,
      phoiHop: coopChecked.join(', '),
      diem: document.getElementById('f-diem').value.trim(),
      ghiChu: document.getElementById('f-ghichu').value.trim(),
      minhChung: modalMinhChung.slice()
    };
    if(!data.noiDung){ alert('Vui lòng nhập nội dung công việc.'); return; }
    const id = el.dataset.id;
    data.lastEditedBy = getMyName();
    data.lastEditedAt = nowStr();
    if(id){
      const idx = state.tasks.findIndex(t=>t.id===id);
      state.tasks[idx] = {...state.tasks[idx], ...data};
      logActivity('Sửa công việc', `[${deptName(dept)}] ${data.noiDung}`);
    } else {
      state.tasks.push({id:newId(dept), month: state.currentMonth, ...data});
      logActivity('Thêm công việc mới', `[${deptName(dept)}] ${data.noiDung}`);
    }
    modalMode=null; editingTaskId=null;
    await persist(); render();
    return;
  }

  if(action==='create-newmonth'){
    const uNM = getCurrentUser();
    if(!uNM || !FULL_ACCESS_TITLES.includes(uNM.chucVu)){ alert('Chỉ Lãnh đạo UBND / Lãnh đạo Văn phòng được tạo kỳ tháng mới.'); return; }
    const mVal = document.getElementById('nm-month').value;
    const mode = document.getElementById('nm-mode').value;
    if(!mVal){ alert('Vui lòng chọn tháng.'); return; }
    if(!state.months.includes(mVal)) state.months.push(mVal);
    state.months.sort();
    let soLuongSaoChep = 0;
    if(mode!=='empty'){
      const source = tasksForMonth(state.currentMonth);
      const toCopy = mode==='recurring' ? source.filter(t=>/thường xuyên/i.test(t.thoiHan)) : source;
      toCopy.forEach(t=>{
        state.tasks.push({...t, id:newId(t.dept), month:mVal, status:'todo', diem:'', ghiChu:'', lastEditedBy:getMyName(), lastEditedAt:nowStr()});
      });
      soLuongSaoChep = toCopy.length;
    }
    logActivity('Tạo kỳ tháng mới', `${monthLabel(mVal)} (sao chép ${soLuongSaoChep} công việc, chế độ: ${mode})`);
    state.currentMonth = mVal;
    modalMode=null;
    await persist(); render();
    return;
  }

  if(action==='add-staff'){
    const name = document.getElementById('staff-name').value.trim();
    const chucVu = document.getElementById('staff-chucvu').value.trim();
    const dept = document.getElementById('staff-dept').value;
    if(!canManageStaffFor(dept)){ alert('Bạn không có quyền thêm cán bộ cho đơn vị này. Chỉ lãnh đạo đúng đơn vị hoặc Lãnh đạo UBND xã mới được thêm.'); return; }
    if(!name){ alert('Vui lòng nhập họ tên.'); return; }
    state.staff.push({id:newId('cb'), name, chucVu, dept});
    logActivity('Thêm cán bộ', `${name} (${deptName(dept)})`);
    await persist(); render();
    return;
  }
  if(action==='add-staff-bulk'){
    const dept = document.getElementById('staff-bulk-dept').value;
    if(!canManageStaffFor(dept)){ alert('Bạn không có quyền thêm cán bộ cho đơn vị này. Chỉ lãnh đạo đúng đơn vị hoặc Lãnh đạo UBND xã mới được thêm.'); return; }
    const raw = document.getElementById('staff-bulk').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let count = 0;
    lines.forEach(line=>{
      const [name, chucVu] = line.split(' - ').map(s=>s? s.trim(): '');
      if(name){ state.staff.push({id:newId('cb'), name, chucVu:chucVu||'Chuyên viên', dept}); count++; }
    });
    if(count) logActivity('Thêm hàng loạt cán bộ', `${count} người (${deptName(dept)})`);
    await persist(); render();
    return;
  }
  if(action==='delete-staff'){
    const s0 = state.staff.find(x=>x.id===el.dataset.id);
    if(!s0) return;
    if(!canManageStaffFor(s0.dept)){ alert('Bạn không có quyền xoá cán bộ của đơn vị này.'); return; }
    if(confirm('Xoá cán bộ này khỏi danh sách?')){
      logActivity('Xoá cán bộ', s0.name);
      state.staff = state.staff.filter(s=>s.id!==el.dataset.id);
      await persist(); render();
    }
    return;
  }

  if(action==='print-report'){ window.print(); return; }
  if(action==='export-excel'){ exportDashboardExcel(); return; }
  if(action==='export-field-stats'){ exportFieldStatsExcel(); return; }
  if(action==='export-assignee-stats'){ exportAssigneeStatsExcel(); return; }
  if(action==='export-year-stats'){ exportYearStatsExcel(); return; }
});

document.addEventListener('change', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='set-month'){ state.currentMonth = el.value; render(); return; }
  if(action==='minhchung-file-selected'){
    const file = el.files && el.files[0];
    if(file) handleMinhChungFileSelected(file);
    el.value = ''; // cho phép chọn lại cùng 1 file lần sau nếu cần
    return;
  }
  if(action==='modal-dept-change'){
    const dept = el.value;
    const deptStaff = state.staff.filter(s=>s.dept===dept).slice().sort((a,b)=>{const r=roleRank(a)-roleRank(b); return r!==0?r:(a.name||'').localeCompare(b.name||'','vi');});
    const optsHtml = '<option value="">— Chọn cán bộ —</option>' + deptStaff.map(s=>`<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)} (${escapeHtml(s.chucVu)})</option>`).join('');
    const chutriSel = document.getElementById('f-chutri');
    const thuchienSel = document.getElementById('f-thuchien');
    if(chutriSel) chutriSel.innerHTML = optsHtml;
    if(thuchienSel) thuchienSel.innerHTML = optsHtml;
    const linhVucList = [...new Set(state.tasks.filter(x=>x.dept===dept).map(x=>x.linhVuc))];
    const dl = document.getElementById('linhvuc-list');
    if(dl) dl.innerHTML = linhVucList.map(lv=>`<option value="${escapeHtml(lv)}">`).join('');
    return;
  }
  if(action==='staffunit-change'){
    const sel = document.getElementById('staff-chucvu');
    if(sel) sel.innerHTML = roleOptionsFor(el.value).map(r=>`<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
    return;
  }
  if(action==='status-select-in-modal'){
    if(el.value === 'done'){
      const inp = document.getElementById('f-minhchung-input');
      if(inp) inp.click();
    }
    return;
  }
  if(action==='update-status'){
    const t = state.tasks.find(x=>x.id===el.dataset.id);
    if(t && !canEditDept(t.dept)){ alert('Bạn không có quyền sửa công việc của đơn vị này.'); render(); return; }
    if(t){
      const oldStatus = STATUS_META[t.status]?.label || t.status;
      const newStatus = el.value;
      t.status = newStatus;
      t.lastEditedBy = getMyName(); t.lastEditedAt = nowStr();
      logActivity('Đổi trạng thái', `[${deptName(t.dept)}] ${t.noiDung}: ${oldStatus} → ${STATUS_META[newStatus].label}`);
      await persist(); render();
      if(newStatus === 'done'){
        quickUploadForTask(t.id); // mở ngay hộp thoại chọn file kết quả — có thể bấm Cancel để bỏ qua
      }
    }
    return;
  }
  if(action==='filter-search'){ uiFilters[el.dataset.dept].search = el.value; render(); return; }
  if(action==='filter-linhvuc'){ uiFilters[el.dataset.dept].linhVuc = el.value; render(); return; }
  if(action==='filter-status'){ uiFilters[el.dataset.dept].status = el.value; render(); return; }
});
document.addEventListener('input', (e)=>{
  const el = e.target.closest('[data-action="filter-search"]');
  if(el){ uiFilters[el.dataset.dept].search = el.value; renderDeptTableOnly(el.dataset.dept); }
});
// nhẹ: cập nhật chỉ bảng khi gõ tìm kiếm để tránh mất focus ô nhập
function renderDeptTableOnly(deptId){
  const f = uiFilters[deptId];
  let tasks = state.tasks.filter(t=>t.dept===deptId && t.month===state.currentMonth);
  if(f.search){ const q=f.search.toLowerCase(); tasks = tasks.filter(t=>(t.noiDung+' '+t.yeuCau+' '+t.linhVuc).toLowerCase().includes(q)); }
  if(f.linhVuc) tasks = tasks.filter(t=>t.linhVuc===f.linhVuc);
  if(f.status) tasks = tasks.filter(t=>t.status===f.status);
  tasks = sortByDeadline(tasks);
  const wrap = document.querySelector('#content .table-wrap');
  if(wrap) wrap.outerHTML = renderTaskTable(tasks);
}

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  if(CONFIG_CHUA_SET){
    document.getElementById('app').innerHTML =
      '<div class="empty-state"><div class="big">Chưa cấu hình máy chủ dữ liệu dùng chung</div>'+
      'Mở file bằng trình soạn thảo, tìm dòng <code>FIREBASE_CONFIG</code> gần đầu file và dán thông tin '+
      'dự án Firebase của bạn vào (xem "Hướng dẫn triển khai" đi kèm). '+
      'Trong lúc chưa cấu hình, bạn vẫn xem thử được giao diện với dữ liệu mẫu, nhưng thay đổi sẽ KHÔNG được lưu lại.</div>';
    // vẫn cho xem thử giao diện với dữ liệu mẫu (không lưu)
    state = defaultState();
    setTimeout(render, 50);
    return;
  }
  try{
    const snap = await docRef.get();
    if(snap.exists){
      state = snap.data();
    } else {
      state = defaultState();
      await docRef.set(state);
    }
    firestoreReady = true;
    render();
    subscribeRealtime();
    recordVisit();
  }catch(e){
    console.error(e);
    document.getElementById('app').innerHTML =
      '<div class="empty-state"><div class="big">Không kết nối được máy chủ dữ liệu dùng chung</div>'+
      'Kiểm tra: (1) cấu hình FIREBASE_CONFIG đã đúng chưa, (2) đã bật Cloud Firestore trong dự án Firebase chưa, '+
      '(3) Quy tắc bảo mật (Rules) đã cho phép đọc/ghi chưa. Xem "Hướng dẫn triển khai" đi kèm.</div>';
  }
})();
</script>
